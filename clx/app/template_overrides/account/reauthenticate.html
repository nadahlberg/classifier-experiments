{% extends "layouts/card.html" %}

{% block title %}Confirm password{% endblock %}

{% block card %}
<div class="card w-full max-w-md">
  <h1 class="text-2xl font-semibold tracking-tight">Confirm password</h1>
  <p class="mt-1 text-sm text-muted-foreground">Enter your password to continue.</p>
  <form method="post" action="{% url 'account_reauthenticate' %}" class="mt-6 space-y-5">
    {% csrf_token %}
    <c-account.fields />
    {{ redirect_field }}
    <button type="submit" class="btn w-full">Confirm</button>
  </form>
</div>
{% endblock %}
