{% extends "layouts/card.html" %}

{% block title %}Reset password{% endblock %}

{% block card %}
<div class="card w-full max-w-md">
  <h1 class="text-2xl font-semibold tracking-tight">Reset password</h1>
  <p class="mt-1 text-sm text-muted-foreground">We'll email you a link to set a new one.</p>
  <form method="post" action="{% url 'account_reset_password' %}" class="mt-6 space-y-5">
    {% csrf_token %}
    <c-account.fields />
    {{ redirect_field }}
    <button type="submit" class="btn w-full">Send reset link</button>
  </form>
  <p class="mt-6 text-center text-sm text-muted-foreground">
    Remembered it?
    <a href="{% url 'account_login' %}" class="font-medium text-foreground underline underline-offset-4">Sign in</a>
  </p>
</div>
{% endblock %}
