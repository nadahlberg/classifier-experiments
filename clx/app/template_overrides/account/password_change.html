{% extends "layouts/card.html" %}

{% block title %}Change password{% endblock %}

{% block card %}
<div class="card w-full max-w-md">
  <h1 class="text-2xl font-semibold tracking-tight">Change password</h1>
  <p class="mt-1 text-sm text-muted-foreground">Choose something you haven't used before.</p>
  <form method="post" action="{% url 'account_change_password' %}" class="mt-6 space-y-5">
    {% csrf_token %}
    {{ redirect_field }}
    <c-account.fields />
    <button type="submit" class="btn w-full">Change password</button>
  </form>
  <p class="mt-4 text-center text-sm">
    <a href="{% url 'account_reset_password' %}" class="text-muted-foreground underline underline-offset-4">Forgot your password?</a>
  </p>
</div>
{% endblock %}
