{% extends "layouts/card.html" %}

{% block title %}Sign in{% endblock %}

{% block card %}
<div class="card w-full max-w-md">
  <h1 class="text-2xl font-semibold tracking-tight">Sign in</h1>
  <p class="mt-1 text-sm text-muted-foreground">Welcome back.</p>
  <form method="post" action="{% url 'account_login' %}" class="mt-6 space-y-5">
    {% csrf_token %}
    <c-account.fields />
    <button type="submit" class="btn w-full">Sign in</button>
  </form>
  <p class="mt-4 text-center text-sm">
    <a href="{% url 'account_reset_password' %}" class="text-muted-foreground underline underline-offset-4">Forgot your password?</a>
  </p>
  <p class="mt-6 text-center text-sm text-muted-foreground">
    Don't have an account?
    <a href="{% url 'account_signup' %}" class="font-medium text-foreground underline underline-offset-4">Create one</a>
  </p>
</div>
{% endblock %}
