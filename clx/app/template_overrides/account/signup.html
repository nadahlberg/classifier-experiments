{% extends "layouts/card.html" %}

{% block title %}Create account{% endblock %}

{% block card %}
<div class="card w-full max-w-md">
  <h1 class="text-2xl font-semibold tracking-tight">Create account</h1>
  <p class="mt-1 text-sm text-muted-foreground">Get started in seconds.</p>
  <form method="post" action="{% url 'account_signup' %}" class="mt-6 space-y-5">
    {% csrf_token %}
    <c-account.fields />
    <button type="submit" class="btn w-full">Create account</button>
  </form>
  <p class="mt-6 text-center text-sm text-muted-foreground">
    Already have an account?
    <a href="{% url 'account_login' %}" class="font-medium text-foreground underline underline-offset-4">Sign in</a>
  </p>
</div>
{% endblock %}
