{% extends "layouts/card.html" %}

{% block title %}Sign out{% endblock %}

{% block card %}
<div class="card w-full max-w-md text-center">
  <h1 class="text-2xl font-semibold tracking-tight">Sign out</h1>
  <p class="mt-2 text-sm text-muted-foreground">Are you sure you want to sign out?</p>
  <form method="post" action="{% url 'account_logout' %}" class="mt-6">
    {% csrf_token %}
    {{ redirect_field }}
    <button type="submit" class="btn w-full">Sign out</button>
  </form>
  <a href="{% url 'demos' %}" class="btn-outline mt-3 w-full">Cancel</a>
</div>
{% endblock %}
