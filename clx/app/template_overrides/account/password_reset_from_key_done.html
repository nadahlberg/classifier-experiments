{% extends "layouts/card.html" %}

{% block title %}Password changed{% endblock %}

{% block card %}
<div class="card w-full max-w-md text-center">
  <h1 class="text-2xl font-semibold tracking-tight">Password changed</h1>
  <p class="mt-2 text-sm text-muted-foreground">You can now sign in with your new password.</p>
  <a href="{% url 'account_login' %}" class="btn mt-6">Sign in</a>
</div>
{% endblock %}
