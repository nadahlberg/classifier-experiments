{% extends "layouts/card.html" %}

{% block title %}Set password{% endblock %}

{% block card %}
<div class="card w-full max-w-md">
  <h1 class="text-2xl font-semibold tracking-tight">Set password</h1>
  <p class="mt-1 text-sm text-muted-foreground">Your account doesn't have a password yet.</p>
  <form method="post" action="{% url 'account_set_password' %}" class="mt-6 space-y-5">
    {% csrf_token %}
    {{ redirect_field }}
    <c-account.fields />
    <button type="submit" name="action" class="btn w-full">Set password</button>
  </form>
</div>
{% endblock %}
