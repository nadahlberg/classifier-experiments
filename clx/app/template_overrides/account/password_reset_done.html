{% extends "layouts/card.html" %}

{% block title %}Check your email{% endblock %}

{% block card %}
<div class="card w-full max-w-md text-center">
  <h1 class="text-2xl font-semibold tracking-tight">Check your email</h1>
  <p class="mt-2 text-sm text-muted-foreground">
    If an account exists for that address, we've sent a reset link. If it
    isn't in your inbox, check your spam folder.
  </p>
  <a href="{% url 'account_login' %}" class="btn-outline mt-6">Back to sign in</a>
</div>
{% endblock %}
