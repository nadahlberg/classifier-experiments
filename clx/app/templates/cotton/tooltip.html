<c-vars label="" position="top" />

<span class="group/tooltip relative inline-flex">
  {{ slot }}
  <span
    role="tooltip"
    class="pointer-events-none absolute z-40 whitespace-nowrap rounded-md bg-inverse-surface px-2 py-1 text-xs font-medium text-inverse-foreground opacity-0 transition group-hover/tooltip:opacity-100
      {% if position == 'bottom' %}left-1/2 top-full mt-2 -translate-x-1/2{% elif position == 'left' %}right-full top-1/2 mr-2 -translate-y-1/2{% elif position == 'right' %}left-full top-1/2 ml-2 -translate-y-1/2{% else %}bottom-full left-1/2 mb-2 -translate-x-1/2{% endif %}"
  >{{ label }}</span>
</span>
