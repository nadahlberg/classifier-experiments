<c-vars align="left" />

<div x-data="dropdown" class="relative inline-block">
  <div @click="toggle">{{ trigger }}</div>
  <div
    x-show="open"
    x-cloak
    @click.outside="close"
    @keydown.escape.window="close"
    x-transition:enter="transition ease-out duration-150"
    x-transition:enter-start="opacity-0 -translate-y-1"
    x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="transition ease-in duration-100"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    class="absolute z-40 mt-1 min-w-40 rounded-control border border-border bg-surface p-1 shadow-card {% if align == 'right' %}right-0{% else %}left-0{% endif %}"
  >
    {{ slot }}
  </div>
</div>

{% script %}
<script>
  document.addEventListener("alpine:init", () => {
    Alpine.data("dropdown", () => ({
      open: false,
      toggle() { this.open = !this.open; },
      close() { this.open = false; },
    }));
  });
</script>
{% endscript %}
