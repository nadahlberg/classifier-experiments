<div
  x-data="codebaseExplorer"
  class="mx-auto w-full max-w-3xl py-2"
>
  {{ inventory|json_script:"codebase-inventory" }}
  <div class="flex flex-col gap-2 lg:flex-row">
    <div class="relative min-w-0 flex-1">
      <svg class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7" />
        <path d="m21 21-4.3-4.3" />
      </svg>
      <input type="text" placeholder="Search the codebase…" @input="search" class="pl-10" aria-label="Search the codebase inventory">
    </div>
    <div class="flex shrink-0 gap-2">
      <div class="relative min-w-0 flex-1 lg:flex-none">
        <select @change="setLayer" aria-label="Filter by layer" class="h-full w-full appearance-none rounded-control border border-border-strong bg-surface py-2.5 pl-3 pr-9 text-sm text-foreground outline-none transition focus:border-ring focus:ring-1 focus:ring-ring">
          <option value="">All layers</option>
          <template x-for="tier in $store.codebase.layerTiers" :key="tier.label">
            <optgroup :label="tier.label">
              <template x-for="opt in tier.options" :key="opt.value">
                <option :value="opt.value" x-text="opt.label"></option>
              </template>
            </optgroup>
          </template>
        </select>
        <svg class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </div>
      <div class="relative min-w-0 flex-1 lg:flex-none">
        <select @change="setGroup" aria-label="Filter by group" class="h-full w-full appearance-none rounded-control border border-border-strong bg-surface py-2.5 pl-3 pr-9 text-sm text-foreground outline-none transition focus:border-ring focus:ring-1 focus:ring-ring">
          <option value="">All groups</option>
          <template x-for="opt in $store.codebase.groupOptions" :key="opt.value">
            <option :value="opt.value" x-text="opt.label"></option>
          </template>
        </select>
        <svg class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </div>
    </div>
  </div>

  <div x-show="$store.codebase.showList" x-cloak class="mt-4">
    <template x-for="section in $store.codebase.sections" :key="section.key">
      <section class="mb-4 overflow-hidden rounded-control border border-border bg-surface">
        <div class="sticky top-0 z-10 flex items-center justify-between gap-3 border-b border-border bg-surface px-4 py-2">
          <p class="min-w-0 truncate text-xs font-semibold uppercase tracking-wide text-muted-foreground" x-text="section.label"></p>
          <span class="shrink-0 text-xs text-muted-foreground" x-text="section.count"></span>
        </div>
        <div class="divide-y divide-border">
          <template x-for="item in section.items" :key="item.id">
            <button type="button" :data-id="item.id" @click="select" :class="item.cardClasses" class="block w-full px-4 py-3 text-left transition">
              <div class="flex items-center justify-between gap-3">
                <span class="min-w-0 truncate font-mono text-sm font-medium text-foreground" x-text="item.name"></span>
                <span class="shrink-0 rounded-full bg-muted px-2 py-0.5 text-[11px] font-medium text-muted-foreground" x-text="item.layerLabel"></span>
              </div>
              <p x-show="item.subtitle" class="mt-0.5 truncate font-mono text-xs text-muted-foreground" x-text="item.subtitle"></p>
              <p x-show="item.docLine" class="mt-0.5 truncate text-xs text-muted-foreground" x-text="item.docLine"></p>
              <div x-show="item.chips.length" class="mt-1.5 flex flex-wrap gap-1">
                <template x-for="chip in item.chips" :key="chip.key">
                  <span :class="chip.classes" class="rounded-full px-2 py-0.5 text-[11px] font-medium" x-text="chip.label"></span>
                </template>
              </div>
            </button>
          </template>
        </div>
      </section>
    </template>
  </div>

  <div x-show="$store.codebase.showEmpty" x-cloak class="mt-4 rounded-control border border-dashed border-border px-6 py-14 text-center">
    <svg class="mx-auto h-8 w-8 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m16 18 6-6-6-6" />
      <path d="m8 6-6 6 6 6" />
    </svg>
    <p class="mt-3 text-sm font-medium text-foreground">No matches</p>
    <p class="mt-1 text-sm text-muted-foreground">Nothing in the inventory matches the current search and filters.</p>
  </div>
</div>

{% script %}
<script>
  const CODEBASE_LAYERS = [
    { value: "model", label: "Model", plural: "Models", tier: "Backend" },
    { value: "selector", label: "Selector", plural: "Selectors", tier: "Backend" },
    { value: "service", label: "Service", plural: "Services", tier: "Backend" },
    { value: "task", label: "Task", plural: "Tasks", tier: "Backend" },
    { value: "endpoint", label: "Endpoint", plural: "Endpoints", tier: "Interfaces" },
    { value: "view", label: "View", plural: "Views", tier: "Interfaces" },
    { value: "mcp-tool", label: "MCP tool", plural: "MCP tools", tier: "Interfaces" },
    { value: "command", label: "Command", plural: "Commands", tier: "Interfaces" },
    { value: "permission", label: "Permission", plural: "Permissions", tier: "Contracts" },
    { value: "group", label: "Group", plural: "Groups", tier: "Contracts" },
    { value: "scope", label: "Scope", plural: "Scopes", tier: "Contracts" },
    { value: "cache-key", label: "Cache key", plural: "Cache keys", tier: "Contracts" },
    { value: "search-index", label: "Search index", plural: "Search indexes", tier: "Contracts" },
    { value: "beat-entry", label: "Beat entry", plural: "Beat entries", tier: "Contracts" },
    { value: "page", label: "Page", plural: "Pages", tier: "Frontend" },
    { value: "layout", label: "Layout", plural: "Layouts", tier: "Frontend" },
    { value: "component", label: "Component", plural: "Components", tier: "Frontend" },
    { value: "script", label: "Script", plural: "Scripts", tier: "Frontend" },
    { value: "middleware", label: "Middleware", plural: "Middleware", tier: "Wiring" },
    { value: "context-processor", label: "Context processor", plural: "Context processors", tier: "Wiring" },
    { value: "signal", label: "Signal", plural: "Signals", tier: "Wiring" },
    { value: "templatetag", label: "Template tag", plural: "Template tags", tier: "Wiring" },
    { value: "check", label: "Check", plural: "Checks", tier: "Wiring" },
  ];

  const CODEBASE_CHIP_CLASSES = {
    perm: "bg-warning-soft text-warning-soft-foreground",
    scope: "bg-info-soft text-info-soft-foreground",
    auth: "bg-info-soft text-info-soft-foreground",
    beat: "bg-success-soft text-success-soft-foreground",
    external: "bg-muted text-muted-foreground",
    default: "bg-accent text-accent-foreground",
  };

  const CODEBASE_GROUP_RANK = { domain: 0, api: 1, pages: 2 };

  const CODEBASE_REF_LABELS = {
    calls: ["Calls", "Called by"],
    queues: ["Queues", "Queued by"],
    runs: ["Runs", "Run by"],
    busts: ["Busts", "Busted by"],
    uses: ["Uses", "Used by"],
    extends: ["Extends", "Extended by"],
    renders: ["Renders", "Rendered by"],
    relates: ["Relates to", "Related to"],
    requires: ["Requires", "Required by"],
    scoped: ["Requires scope", "Required by"],
    grants: ["Grants", "Granted by"],
    origin: ["Defined in", "Defines"],
  };

  document.addEventListener("alpine:init", () => {
    Alpine.store("codebase", {
      started: false,
      items: [],
      byId: {},
      query: "",
      layer: "",
      group: "",
      groupBy: "layer",
      selectedId: "",
      trail: [],
      layerTiers: [],
      groupOptions: [],
      start(data) {
        if (this.started) return;
        this.started = true;
        const items = data.map((item) => this.enrich(item));
        const byId = {};
        for (const item of items) byId[item.id] = item;
        for (const item of items) {
          for (const ref of item.refs || []) {
            const target = byId[ref.id];
            if (target) target.back.push({ kind: ref.kind, id: item.id });
          }
        }
        this.layerTiers = this.tiersFor(items);
        this.groupOptions = this.groupsFor(items);
        this.byId = byId;
        this.items = items;
      },
      enrich(item) {
        const meta = CODEBASE_LAYERS.find((l) => l.value === item.layer);
        item.layerLabel = meta ? meta.label : item.layer;
        item.layerPlural = meta ? meta.plural : item.layer;
        item.layerRank = meta ? CODEBASE_LAYERS.indexOf(meta) : 99;
        item.groupKey = item.group ? `${item.group.kind}:${item.group.name}` : "";
        item.groupLabel = item.group ? `${item.group.kind} · ${item.group.name}` : "";
        item.subtitle = (item.details && item.details.route) || item.signature || "";
        item.docLine = item.doc ? item.doc.split("\n")[0] : "";
        item.chips = (item.chips || []).map((chip) => ({
          ...chip,
          key: `${chip.kind}:${chip.label}`,
          classes: CODEBASE_CHIP_CLASSES[chip.kind] || CODEBASE_CHIP_CLASSES.default,
        }));
        item.pathLine = item.path ? item.path + (item.line ? `:${item.line}` : "") : "";
        item.haystack = [
          item.name,
          item.signature || "",
          item.doc || "",
          item.path || "",
          item.groupLabel,
          Object.values(item.details || {}).join(" "),
          item.chips.map((chip) => chip.label).join(" "),
        ].join(" ").toLowerCase();
        item.back = [];
        return item;
      },
      tiersFor(items) {
        const counts = {};
        for (const item of items) counts[item.layer] = (counts[item.layer] || 0) + 1;
        const tiers = [];
        for (const layer of CODEBASE_LAYERS) {
          const count = counts[layer.value];
          if (!count) continue;
          let tier = tiers.find((t) => t.label === layer.tier);
          if (!tier) {
            tier = { label: layer.tier, options: [] };
            tiers.push(tier);
          }
          tier.options.push({ value: layer.value, label: `${layer.plural} (${count})` });
        }
        return tiers;
      },
      groupsFor(items) {
        const seen = new Map();
        for (const item of items) {
          if (!item.group) continue;
          const entry = seen.get(item.groupKey) || {
            value: item.groupKey,
            kind: item.group.kind,
            name: item.group.name,
            count: 0,
          };
          entry.count += 1;
          seen.set(item.groupKey, entry);
        }
        return [...seen.values()]
          .sort((a, b) => {
            const byKind =
              (CODEBASE_GROUP_RANK[a.kind] ?? 3) -
              (CODEBASE_GROUP_RANK[b.kind] ?? 3);
            return byKind || a.name.localeCompare(b.name);
          })
          .map((entry) => ({
            value: entry.value,
            label: `${entry.kind} · ${entry.name} (${entry.count})`,
          }));
      },
      get filtered() {
        const q = this.query.trim().toLowerCase();
        return this.items.filter((item) =>
          (!this.layer || item.layer === this.layer) &&
          (!this.group || item.groupKey === this.group) &&
          (!q || item.haystack.includes(q)));
      },
      get sections() {
        const buckets = new Map();
        for (const item of this.filtered) {
          let key, label, order;
          if (this.groupBy === "group") {
            if (item.group) {
              key = `g:${item.groupKey}`;
              label = item.groupLabel;
              order = (CODEBASE_GROUP_RANK[item.group.kind] ?? 3) * 1000;
            } else {
              key = "g:zz";
              label = "Contracts & wiring";
              order = 9000;
            }
          } else if (this.groupBy === "file") {
            key = `f:${item.path || "zz"}`;
            label = item.path || "External";
            order = item.path ? 0 : 9000;
          } else {
            key = `l:${item.layer}`;
            label = item.layerPlural;
            order = item.layerRank;
          }
          let bucket = buckets.get(key);
          if (!bucket) {
            bucket = { key, label, order, items: [] };
            buckets.set(key, bucket);
          }
          bucket.items.push(item);
        }
        const sections = [...buckets.values()];
        sections.sort((a, b) => a.order - b.order || a.label.localeCompare(b.label));
        for (const section of sections) {
          const sorted = section.items.slice().sort((a, b) =>
            a.layerRank - b.layerRank ||
            (a.path || "\uffff").localeCompare(b.path || "\uffff") ||
            (a.line || 0) - (b.line || 0) ||
            a.name.localeCompare(b.name));
          section.items = sorted.map((item) => ({
            ...item,
            cardClasses: item.id === this.selectedId ? "bg-accent" : "hover:bg-accent",
          }));
          section.count = section.items.length;
        }
        return sections;
      },
      get showList() { return this.filtered.length > 0; },
      get showEmpty() { return this.started && this.filtered.length === 0; },
      get summary() {
        if (!this.started) return "";
        const n = this.filtered.length;
        return `${n} ${n === 1 ? "item" : "items"}`;
      },
      get detail() { return this.byId[this.selectedId] || null; },
      get hasDetail() { return !!this.detail; },
      get noDetail() { return !this.detail; },
      get crumbs() {
        return this.trail.map((id) => this.byId[id]).filter(Boolean);
      },
      get showCrumbs() { return this.crumbs.length > 1; },
      get detailRows() {
        const detail = this.detail;
        if (!detail) return [];
        return Object.entries(detail.details || {}).map(([key, value]) => ({ key, value }));
      },
      get detailRefs() {
        const detail = this.detail;
        if (!detail) return [];
        const groups = [];
        const push = (label, id) => {
          const target = this.byId[id];
          if (!target) return;
          let group = groups.find((g) => g.label === label);
          if (!group) {
            group = { label, targets: [] };
            groups.push(group);
          }
          if (!group.targets.some((t) => t.id === id)) {
            group.targets.push({ id, name: target.name, layerLabel: target.layerLabel });
          }
        };
        for (const ref of detail.refs || []) {
          push((CODEBASE_REF_LABELS[ref.kind] || [ref.kind, ref.kind])[0], ref.id);
        }
        for (const ref of detail.back) {
          push((CODEBASE_REF_LABELS[ref.kind] || [ref.kind, ref.kind])[1], ref.id);
        }
        return groups;
      },
      open(id) {
        if (!this.byId[id]) return;
        const at = this.trail.indexOf(id);
        if (at >= 0) this.trail = this.trail.slice(0, at + 1);
        else this.trail = [...this.trail, id].slice(-5);
        this.selectedId = id;
      },
      setQuery(value) { this.query = value; },
      setLayer(value) { this.layer = value; },
      setGroup(value) { this.group = value; },
      setGroupBy(value) { this.groupBy = value; },
    });

    Alpine.data("codebaseExplorer", () => ({
      timer: null,
      init() {
        this.$store.codebase.start(
          JSON.parse(document.getElementById("codebase-inventory").textContent)
        );
      },
      search(evt) {
        clearTimeout(this.timer);
        const value = evt.target.value;
        this.timer = setTimeout(() => this.$store.codebase.setQuery(value), 250);
      },
      setLayer(evt) { this.$store.codebase.setLayer(evt.target.value); },
      setGroup(evt) { this.$store.codebase.setGroup(evt.target.value); },
      select(evt) { this.$store.codebase.open(evt.currentTarget.dataset.id); },
    }));
  });
</script>
{% endscript %}
