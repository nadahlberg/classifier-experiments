<div x-data="codebaseToolbar" class="flex min-w-0 flex-1 items-center justify-between gap-4">
  <p class="min-w-0 truncate text-sm font-medium text-foreground">Codebase</p>
  <div class="flex shrink-0 items-center gap-3">
    <span class="hidden text-xs text-muted-foreground sm:block" x-text="$store.codebase.summary"></span>
    <div class="relative">
      <select @change="setGroupBy" aria-label="Group items by" class="appearance-none rounded-control border border-border-strong bg-surface py-1.5 pl-3 pr-8 text-xs text-foreground outline-none transition focus:border-ring focus:ring-1 focus:ring-ring">
        <option value="layer">By layer</option>
        <option value="group">By group</option>
        <option value="file">By file</option>
      </select>
      <svg class="pointer-events-none absolute right-2.5 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m6 9 6 6 6-6" />
      </svg>
    </div>
  </div>
</div>

{% script %}
<script>
  document.addEventListener("alpine:init", () => {
    Alpine.data("codebaseToolbar", () => ({
      setGroupBy(evt) {
        this.$store.codebase.setGroupBy(evt.target.value);
      },
    }));
  });
</script>
{% endscript %}
