<c-vars />
{% if messages %}
  <div class="pointer-events-none fixed inset-x-0 bottom-0 z-50 flex flex-col items-center gap-2 p-4 sm:items-end">
    {% for message in messages %}
      <div
        x-data="toast"
        x-show="show"
        x-cloak
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-2"
        x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 translate-y-0"
        x-transition:leave-end="opacity-0 translate-y-2"
        class="pointer-events-auto flex max-w-sm items-center gap-3 rounded-full bg-inverse-surface py-2 pl-4 pr-2 text-sm text-inverse-foreground shadow-card"
      >
        <svg class="h-4 w-4 shrink-0 -rotate-90" viewBox="0 0 16 16" fill="none" stroke-width="2">
          <circle cx="8" cy="8" r="6" stroke="currentColor" class="text-inverse-foreground/20" />
          <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-dasharray="37.7" class="toast-drain {% if message.level_tag == 'error' %}text-danger{% elif message.level_tag == 'success' %}text-success{% elif message.level_tag == 'warning' %}text-warning{% else %}text-inverse-muted{% endif %}" />
        </svg>
        <span>{{ message }}</span>
        <button type="button" @click="dismiss" aria-label="Dismiss" class="shrink-0 rounded-full p-1 text-inverse-muted transition hover:bg-inverse-foreground/10 hover:text-inverse-foreground">
          <svg class="h-3.5 w-3.5" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M3.5 3.5l7 7m0-7l-7 7" />
          </svg>
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}

{% script %}
<script>
  document.addEventListener("alpine:init", () => {
    Alpine.data("toast", () => ({
      show: false,
      init() {
        this.$nextTick(() => { this.show = true; });
        setTimeout(() => { this.show = false; }, 4000);
      },
      dismiss() { this.show = false; },
    }));
  });
</script>
{% endscript %}
