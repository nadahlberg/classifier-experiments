<c-vars title="" size="md" confirm="" />

<div x-data="modal" data-confirm="{{ confirm }}" class="inline-block">
  <span @click="show">{{ trigger }}</span>
  <template x-teleport="body">
    <div x-show="open" x-cloak @keydown.escape.window="close" @modal-close.stop="close" class="fixed inset-0 z-50 overflow-y-auto">
      <div
        x-show="open"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed inset-0 bg-inverse-surface/50"
      ></div>
      <div class="flex min-h-full items-end justify-center p-4 sm:items-center">
        <div
          x-show="open"
          @click.outside="close"
          x-transition:enter="transition ease-out duration-200"
          x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
          x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
          x-transition:leave="transition ease-in duration-150"
          x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
          x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
          role="dialog"
          aria-modal="true"
          {% if title %}aria-label="{{ title }}"{% endif %}
          class="relative w-full rounded-surface bg-surface shadow-xl {% if size == 'sm' %}max-w-sm{% elif size == 'lg' %}max-w-2xl{% else %}max-w-md{% endif %}"
        >
          <div class="flex items-start justify-between gap-4 px-6 pt-5">
            {% if title %}<h2 class="text-lg font-semibold tracking-tight text-foreground">{{ title }}</h2>{% endif %}
            <button type="button" @click="close" aria-label="Close" class="-mr-2 -mt-1 ml-auto rounded-md p-1.5 text-muted-foreground transition hover:bg-accent hover:text-foreground">
              <svg class="h-4 w-4" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <path d="M3.5 3.5l7 7m0-7l-7 7" />
              </svg>
            </button>
          </div>
          <div class="px-6 pb-5 pt-3 text-sm leading-relaxed text-muted-foreground">{{ slot }}</div>
          {% if confirm %}
            <div class="px-6 pb-5">
              <label class="block text-xs font-medium text-accent-foreground">
                Type <span class="font-mono">{{ confirm }}</span> to confirm
                <input type="text" :value="challenge" @input="setChallenge" autocomplete="off" spellcheck="false" class="mt-1.5">
              </label>
            </div>
          {% endif %}
          {% if footer %}
            <div class="flex justify-end gap-3 rounded-b-surface border-t border-border/60 bg-muted px-6 py-4">{{ footer }}</div>
          {% endif %}
        </div>
      </div>
    </div>
  </template>
</div>

{% script %}
<script>
  document.addEventListener("alpine:init", () => {
    Alpine.data("modal", () => ({
      open: false,
      challenge: "",
      confirm: "",
      get confirmed() { return !this.confirm || this.challenge === this.confirm; },
      get blocked() { return !this.confirmed; },
      init() {
        this.confirm = this.$el.dataset.confirm || "";
        this.$watch("open", (open) => {
          document.body.classList.toggle("overflow-hidden", open);
          if (!open) this.challenge = "";
        });
      },
      show() { this.open = true; },
      close() { this.open = false; },
      setChallenge(evt) { this.challenge = evt.target.value; },
    }));
  });
</script>
{% endscript %}
