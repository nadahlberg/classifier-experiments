<c-vars disabled="no" />

{% if disabled == "yes" %}<div{% else %}<a href="{{ href }}"{% endif %}
  class="group relative flex flex-col rounded-surface border border-border bg-surface p-6 transition duration-200 {% if disabled == 'yes' %}opacity-60{% else %}hover:-translate-y-0.5 hover:border-border-strong hover:shadow-card-hover{% endif %}"
>
  <div class="flex h-10 w-10 items-center justify-center rounded-control transition {% if disabled == 'yes' %}bg-muted text-muted-foreground{% else %}bg-primary text-primary-foreground group-hover:bg-primary-hover{% endif %}">
    {{ slot }}
  </div>
  <p class="mt-5 text-sm font-semibold text-foreground">{{ title }}</p>
  <p class="mt-1.5 text-sm leading-6 text-muted-foreground">{{ description }}</p>
  {% if disabled == "yes" %}
    <svg class="absolute right-5 top-5 h-4 w-4 text-muted-foreground/60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="11" width="16" height="9" rx="2" />
      <path d="M8 11V7a4 4 0 0 1 8 0v4" />
    </svg>
  {% else %}
    <svg class="absolute right-5 top-5 h-4 w-4 text-muted-foreground/60 transition duration-200 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 group-hover:text-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 17L17 7" />
      <path d="M8 7h9v9" />
    </svg>
  {% endif %}
{% if disabled == "yes" %}</div>{% else %}</a>{% endif %}
