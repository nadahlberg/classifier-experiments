<article class="rounded-control border border-border bg-surface p-4 shadow-card">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <h3 class="truncate text-sm font-semibold text-foreground" x-text="hit.case_name"></h3>
      <p class="mt-0.5 text-xs text-muted-foreground">
        <span x-text="hit.court"></span>
        <span aria-hidden="true">·</span>
        <span x-text="hit.docket_number"></span>
        <span aria-hidden="true">·</span>
        Filed <span x-text="hit.filed_label"></span>
      </p>
    </div>
    <div class="flex shrink-0 items-center gap-1">
      <span x-show="hit.is_terminated"><c-badge>Terminated</c-badge></span>
      <span x-show="hit.jurisdiction"><c-badge color="info"><span x-text="hit.jurisdiction"></span></c-badge></span>
    </div>
  </div>
  <p class="mt-2 truncate text-xs font-medium text-accent-foreground" x-text="hit.parties_label"></p>
  <ul class="mt-3 space-y-1.5 border-l-2 border-border pl-3">
    <template x-for="entry in hit.entries">
      <li class="text-xs leading-5 text-muted-foreground">
        <span class="font-medium text-foreground" x-text="entry.filed_label"></span>
        <span x-text="entry.description"></span>
      </li>
    </template>
  </ul>
  <p x-show="hit.more_entries_label" class="mt-1.5 pl-3 text-xs text-muted-foreground" x-text="hit.more_entries_label"></p>
</article>
