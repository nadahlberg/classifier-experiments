<div x-data="chatState">
  <p class="text-sm font-medium text-foreground">Agent state</p>
  <p class="mt-2 text-sm leading-6 text-muted-foreground">
    Tools read and write a JSON blob on the thread. The agent's next system
    prompt sees it, and this panel renders it live &mdash; through the
    agent's own template when it declares one, as raw JSON otherwise.
  </p>
  <div class="mt-4">
    <div x-show="showHtml" x-html="stateHtml"></div>
    <pre x-show="showJson" x-cloak class="overflow-x-auto rounded-control bg-muted px-4 py-3 text-xs text-foreground" x-text="stateJson"></pre>
    <p x-show="showEmpty" x-cloak class="text-sm text-muted-foreground">No state yet.</p>
  </div>
</div>

{% script %}
<script>
  document.addEventListener("alpine:init", () => {
    Alpine.data("chatState", () => ({
      get stateHtml() { return this.$store.chat.stateHtml; },
      get stateJson() { return this.$store.chat.stateJson; },
      get showHtml() {
        return this.$store.chat.hasThread && !!this.$store.chat.stateHtml;
      },
      get showJson() {
        const store = this.$store.chat;
        return store.hasThread && !store.stateHtml && store.hasState;
      },
      get showEmpty() {
        const store = this.$store.chat;
        return !store.hasThread || (!store.stateHtml && !store.hasState);
      },
    }));
  });
</script>
{% endscript %}
