<div class="rounded-control border border-border bg-muted px-4 py-3">
  <p class="text-xs font-medium uppercase tracking-wide text-muted-foreground">Recent locations</p>
  {% if state.recent_locations %}
  <ul class="mt-2 space-y-1">
    {% for location in state.recent_locations %}
    <li class="text-sm text-foreground">{{ location }}</li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="mt-2 text-sm text-muted-foreground">No locations checked yet.</p>
  {% endif %}
</div>
