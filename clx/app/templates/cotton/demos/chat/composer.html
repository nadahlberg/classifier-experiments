<div x-data="chatComposer" class="sticky bottom-0 mt-auto bg-background pt-3">
  {% csrf_token %}
  <p x-show="error" x-cloak class="mb-2 text-xs text-danger" x-text="error"></p>
  <form @submit.prevent="send" class="relative">
    <textarea
      x-ref="input"
      x-effect="autosize"
      rows="1"
      :value="draft"
      @input="setDraft"
      @keydown.enter="onEnter"
      placeholder="Ask about the weather&hellip;"
      aria-label="Message"
      class="block max-h-40 w-full resize-none overflow-y-auto rounded-control border border-border-strong py-2.5 pl-3 pr-11 text-sm text-foreground outline-none transition placeholder:text-muted-foreground/70 focus:border-ring focus:ring-1 focus:ring-ring"
    ></textarea>
    <button type="button" x-show="active" x-cloak @click="cancel" aria-label="Stop" class="absolute bottom-[5px] right-[5px] flex h-8 w-8 items-center justify-center rounded-md border border-border text-foreground transition hover:bg-accent">
      <svg class="h-3 w-3" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2" /></svg>
    </button>
    <button type="submit" x-show="notActive" :disabled="busy" aria-label="Send" class="absolute bottom-[5px] right-[5px] flex h-8 w-8 items-center justify-center rounded-md bg-primary text-primary-foreground transition hover:bg-primary-hover disabled:pointer-events-none disabled:opacity-50">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5" /><path d="m5 12 7-7 7 7" /></svg>
    </button>
  </form>
  <div class="mb-1 mt-2 flex h-4 items-center justify-between gap-4 text-xs text-muted-foreground">
    <div class="flex min-w-0 items-center gap-3">
      <span x-text="costLabel"></span>
      <span x-text="tokenLabel"></span>
    </div>
    <div class="relative h-1.5 w-1/3 shrink-0 overflow-hidden rounded-full bg-muted ring-1 ring-inset ring-border">
      <span x-ref="fill" class="absolute inset-y-0 left-0 w-0 rounded-full transition-all" :class="barClass"></span>
      <span class="absolute inset-y-0 left-[80%] w-px bg-border-strong"></span>
    </div>
  </div>
</div>

{% script %}
<script>
  document.addEventListener("alpine:init", () => {
    Alpine.data("chatComposer", () => ({
      get draft() { return this.$store.chat.draft; },
      get busy() { return this.$store.chat.busy; },
      get active() { return this.$store.chat.active; },
      get notActive() { return !this.$store.chat.active; },
      get error() { return this.$store.chat.error; },
      get costLabel() { return this.$store.chat.costLabel; },
      get tokenLabel() { return this.$store.chat.tokenLabel; },
      get barClass() {
        return this.$store.chat.overLimit ? "bg-warning" : "bg-primary";
      },
      init() {
        const fill = this.$refs.fill;
        Alpine.effect(() => {
          fill.style.width = this.$store.chat.barPercent + "%";
        });
      },
      autosize() {
        this.draft;
        this.$nextTick(() => {
          const input = this.$refs.input;
          input.style.height = "auto";
          input.style.height = input.scrollHeight + 2 + "px";
        });
      },
      setDraft(evt) { this.$store.chat.draft = evt.target.value; },
      onEnter(evt) {
        if (evt.shiftKey) return;
        evt.preventDefault();
        this.send();
      },
      send() { this.$store.chat.send(); },
      cancel() { this.$store.chat.cancel(); },
    }));
  });
</script>
{% endscript %}
