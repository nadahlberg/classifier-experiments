{% load static %}
<!doctype html>
<html lang="en" class="scroll-smooth bg-inverse-surface">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>{% block title %}{{ site_config.site_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'main.css' %}">
  <script defer src="{% static 'js/main.js' %}"></script>
  <script defer src="{% static 'js/alpine.min.js' %}"></script>
  <link rel="icon" href="{% static 'icons/favicon.svg' %}" type="image/svg+xml">
  <link rel="manifest" href="{% url 'manifest' %}">
  <meta name="theme-color" content="#F4F1EA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="{{ site_config.site_name }}">
  <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="flex min-h-dvh flex-col bg-background font-sans text-foreground antialiased">
  {% block nav %}{% endblock %}
  {% block content %}{% endblock %}
  {% block footer %}{% endblock %}
  <c-messages />
  {% block extra_body %}{% endblock %}
</body>
</html>

{% script %}
<script>
  function csrfToken() {
    const input = document.querySelector("[name=csrfmiddlewaretoken]");
    if (input) return input.value;
    const cookie = document.cookie.match(/(^|;\s*)csrftoken=([^;]*)/);
    return cookie ? cookie[2] : "";
  }

  async function api(url, { method = "GET", body } = {}) {
    const headers = method === "GET" ? {} : { "X-CSRFToken": csrfToken() };
    if (body !== undefined && !(body instanceof FormData)) {
      headers["Content-Type"] = "application/json";
      body = JSON.stringify(body);
    }

    let response;
    try {
      response = await fetch(url, { method, headers, body });
    } catch {
      throw new Error("Could not reach the server");
    }

    const data = await response.json().catch(() => null);
    if (!response.ok) {
      throw new Error((data && data.message) || "Something went wrong");
    }
    return data;
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js");
    });
  }
</script>
{% endscript %}
