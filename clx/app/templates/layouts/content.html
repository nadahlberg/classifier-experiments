{% extends "layouts/base.html" %}

{% block nav %}<c-nav variant="marketing" />{% endblock %}

{% block content %}
<div class="mx-auto flex w-full max-w-4xl flex-1 gap-32 px-4 py-16 sm:px-6">
  <article class="min-w-0 flex-1">
    <h1 class="font-display text-3xl font-semibold tracking-tight text-foreground">{% block heading %}{% endblock %}</h1>
    <p class="mt-3 text-lg leading-relaxed text-muted-foreground">{% block subheading %}{% endblock %}</p>
    <div class="content mt-14">
      {% block sections %}{% endblock %}
    </div>
  </article>

  <aside class="hidden w-48 shrink-0 lg:block">
    <nav x-data="toc" x-cloak class="sticky top-30" aria-label="Table of contents">
      <p class="text-xs font-medium uppercase tracking-wide text-muted-foreground">On this page</p>
      <ul class="mt-4 space-y-1">
        <template x-for="group in groups" :key="group.id">
          <li>
            <a
              :href="group.href"
              x-text="group.text"
              class="block border-l py-1.5 pl-4 text-sm transition"
              :class="group.linkClass"
            ></a>
            <ul x-show="group.open" class="space-y-0.5">
              <template x-for="child in group.children" :key="child.id">
                <li>
                  <a
                    :href="child.href"
                    x-text="child.text"
                    class="block border-l py-1 pl-8 text-[13px] transition"
                    :class="child.linkClass"
                  ></a>
                </li>
              </template>
            </ul>
          </li>
        </template>
      </ul>
    </nav>
  </aside>
</div>
{% endblock %}

{% block footer %}<c-footer />{% endblock %}

{% script %}
<script>
  document.addEventListener("alpine:init", () => {
    Alpine.data("toc", () => ({
      groups: [],
      active: "",
      pending: false,
      target: null,
      watcher: null,
      observer: null,
      refresh() {
        const rest =
          "border-border text-muted-foreground hover:border-border-strong hover:text-foreground";
        const current = "border-primary font-medium text-primary";
        this.groups.forEach((group) => {
          const inside =
            this.active === group.id ||
            group.children.some((child) => child.id === this.active);
          group.open = group.children.length > 0 && inside;
          group.linkClass =
            this.active === group.id
              ? current
              : inside
                ? "border-border font-medium text-foreground"
                : rest;
          group.children.forEach((child) => {
            child.linkClass = this.active === child.id ? current : rest;
          });
        });
      },
      init() {
        this.target = document.querySelector(".content");
        this.watcher = new MutationObserver(() => this.rescan());
        this.scan();
        this.watch();
      },
      watch() {
        this.watcher.observe(this.target, {
          childList: true,
          subtree: true,
          characterData: true,
        });
      },
      rescan() {
        if (this.pending) return;
        this.pending = true;
        requestAnimationFrame(() => {
          this.pending = false;
          this.watcher.disconnect();
          this.scan();
          this.watch();
        });
      },
      scan() {
        if (this.observer) this.observer.disconnect();

        const nodes = [...this.target.querySelectorAll("h2[id], h3[id]")];
        this.groups = [];
        nodes.forEach((node) => {
          const entry = {
            id: node.id,
            text: node.dataset.tocText || node.textContent.trim(),
            href: "#" + node.id,
            children: [],
            open: false,
            linkClass: "",
          };
          if (node.tagName === "H2" || !this.groups.length) {
            this.groups.push(entry);
          } else {
            this.groups[this.groups.length - 1].children.push(entry);
          }
          this.decorate(node, entry.text);
        });
        this.refresh();

        this.observer = new IntersectionObserver(
          (entries) => {
            const visible = entries
              .filter((entry) => entry.isIntersecting)
              .sort(
                (a, b) => a.boundingClientRect.top - b.boundingClientRect.top,
              );
            if (visible.length) {
              this.active = visible[0].target.id;
              this.refresh();
            }
          },
          { rootMargin: "-96px 0px -65% 0px" },
        );
        nodes.forEach((node) => this.observer.observe(node));
      },
      decorate(node, text) {
        if (node.dataset.tocText) return;
        node.dataset.tocText = text;

        const icon = `<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`;
        const url = new URL("#" + node.id, location.href).href;

        const tip = document.createElement("span");
        tip.textContent = "Copied";
        tip.setAttribute("aria-hidden", "true");
        tip.className =
          "pointer-events-none absolute bottom-full left-1/2 mb-2 -translate-x-1/2 whitespace-nowrap rounded-md bg-inverse-surface px-2 py-1 text-xs font-medium text-inverse-foreground opacity-0 transition";

        const button = document.createElement("button");
        button.type = "button";
        button.setAttribute("aria-label", "Copy link to section");
        button.className =
          "relative ml-2 inline-block align-middle text-muted-foreground/50 opacity-0 transition hover:text-foreground group-hover:opacity-100";
        button.innerHTML = icon;
        button.append(tip);

        let timer;
        button.addEventListener("click", async () => {
          await navigator.clipboard.writeText(url);
          tip.classList.replace("opacity-0", "opacity-100");
          clearTimeout(timer);
          timer = setTimeout(
            () => tip.classList.replace("opacity-100", "opacity-0"),
            1200,
          );
        });

        node.classList.add("group");
        node.append(button);
      },
    }));
  });
</script>
{% endscript %}
